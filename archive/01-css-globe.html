<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akshat Kumar — Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Registered so they can be transitioned (card intro + hover lift). */
  @property --r    { syntax:'<length>'; inherits:false; initial-value:0px; }
  @property --lift { syntax:'<length>'; inherits:false; initial-value:0px; }
  @property --s    { syntax:'<number>'; inherits:false; initial-value:1; }
  @property --in   { syntax:'<number>'; inherits:false; initial-value:0; }

  :root {
    --bg:#f3ede2; --bg-hi:#fbf8f1; --bg-lo:#e2d8c5;
    --ink:#1d1b17; --muted:#8b8375; --accent:#c65a3a;
    --serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:radial-gradient(130% 95% at 50% 42%, var(--bg-hi) 0%, var(--bg) 48%, var(--bg-lo) 100%) fixed var(--bg);
         color:var(--ink); font-family:var(--mono); min-height:100vh; overflow-x:hidden;
         -webkit-font-smoothing:antialiased; }

  /* paper grain, generated once at runtime */
  .grain { position:fixed; inset:0; z-index:0; pointer-events:none; mix-blend-mode:multiply; opacity:.55; }

  .stage { position:relative; z-index:1; min-height:100vh; min-height:100svh;
           display:grid; place-items:center; overflow:hidden; overflow:clip; }

  /* ===================== GLOBE ===================== */
  .globe { position:relative; width:min(74vmin,720px); aspect-ratio:1; isolation:isolate;
           cursor:grab; touch-action:pan-y; user-select:none; -webkit-user-select:none; }
  .globe.drag { cursor:grabbing; }
  .globe::before { content:''; position:absolute; inset:-18%; z-index:-3; border-radius:50%;
                   background:radial-gradient(closest-side, rgba(255,253,248,.95), rgba(255,253,248,.5) 55%, rgba(255,253,248,0)); }

  .dial { position:absolute; left:-12%; top:-12%; width:124%; height:124%; z-index:-2;
          pointer-events:none; overflow:visible; }
  .dial * { vector-effect:non-scaling-stroke; }
  .dial .ring { fill:none; stroke:var(--ink); stroke-opacity:.16; }
  .dial line { stroke:var(--ink); stroke-opacity:.2; }
  .dial line.maj { stroke-opacity:.45; }
  .dial text { font:500 2.9px var(--mono); letter-spacing:.3px; fill:var(--muted); }
  #needle path { fill:var(--accent); }

  .shadow { position:absolute; left:19%; width:62%; bottom:-2%; height:8%; z-index:-1; border-radius:50%;
            background:radial-gradient(closest-side, rgba(74,52,30,.26), rgba(74,52,30,0));
            animation:shadow 7s ease-in-out infinite alternate; }
  @keyframes shadow { from { transform:scale(.9); opacity:.7 } to { transform:scale(1.04); opacity:1 } }

  .float { position:absolute; inset:0; perspective:1500px;
           animation:bob 7s ease-in-out infinite alternate; }
  @keyframes bob { from { transform:translateY(-8px) } to { transform:translateY(4px) } }

  #wire { position:absolute; left:-10%; top:-10%; width:120%; height:120%; pointer-events:none; }
  .sphere { position:absolute; inset:0; transform-style:preserve-3d; will-change:transform; }

  .tile { --r:0px; --lift:0px; --s:1; --in:0; --d:var(--d0,0ms);
          position:absolute; left:50%; top:50%; display:block; overflow:hidden;
          border-radius:6px; background:#e7dfd1; text-decoration:none; outline:none;
          backface-visibility:hidden; -webkit-backface-visibility:hidden;
          transform:rotateY(var(--lon)) rotateX(var(--lat))
                    translateZ(calc(var(--r) + var(--lift))) rotateZ(var(--tz))
                    scale(calc(var(--s) * var(--in)));
          box-shadow:0 0 0 1px rgba(29,27,23,.10), 0 8px 18px -8px rgba(60,40,20,.35);
          transition:--r 1.6s cubic-bezier(.16,1,.3,1) var(--d),
                     --in 1.2s cubic-bezier(.16,1,.3,1) var(--d),
                     --lift .5s cubic-bezier(.2,.9,.3,1), --s .5s cubic-bezier(.2,.9,.3,1),
                     box-shadow .3s ease, filter .4s ease; }
  .globe.ready .tile { --r:var(--R); --in:1; }
  .globe.settled .tile { --d:0ms; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .tile::after { content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
                 background:linear-gradient(145deg, rgba(255,255,255,.3) 0%, rgba(255,255,255,0) 38%,
                                            rgba(0,0,0,0) 70%, rgba(0,0,0,.10) 100%);
                 box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); }
  .tile.on, .tile:focus-visible { --lift:28px; --s:1.14;
      box-shadow:0 0 0 2px var(--accent), 0 18px 30px -10px rgba(60,40,20,.45); }
  .globe.hovering .tile:not(.on) { filter:grayscale(.85) contrast(.9) brightness(1.03); }

  /* ===================== FRAME ===================== */
  .corner { position:absolute; z-index:2; display:flex; align-items:center; gap:10px;
            font:500 11px/1 var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  .corner.tl { top:28px; left:32px; color:var(--ink); }
  .corner.tr { top:28px; right:32px; }
  .corner.br { bottom:32px; right:32px; white-space:pre; font-variant-numeric:tabular-nums; }
  .corner .dot { width:7px; height:7px; border-radius:50%; background:var(--accent);
                 animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35 } }

  .readout { position:absolute; z-index:2; left:32px; bottom:28px; max-width:min(520px,42vw);
             pointer-events:none; }
  .ro-idx { display:flex; gap:8px; font:500 11px/1 var(--mono); letter-spacing:.18em;
            color:var(--muted); font-variant-numeric:tabular-nums; }
  .ro-idx b { font-weight:500; color:var(--accent); }
  .ro-title { font:400 clamp(34px,4.2vw,60px)/1 var(--serif); letter-spacing:-.01em; margin-top:12px; }
  .ro-title em { font-style:italic; color:var(--accent); }
  .ro-meta { font:500 11px/1.4 var(--mono); letter-spacing:.18em; text-transform:uppercase;
             color:var(--muted); margin-top:14px; }
  .readout.swap .ro-title, .readout.swap .ro-meta { animation:swap .45s cubic-bezier(.2,.9,.3,1) backwards; }
  .readout.swap .ro-meta { animation-delay:.05s; }
  @keyframes swap { from { opacity:0; transform:translateY(8px) } }

  .pill { position:fixed; left:0; top:0; z-index:10; pointer-events:none;
          font:600 10px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase;
          color:var(--bg-hi); background:var(--ink); padding:7px 10px 7px 11px; border-radius:999px;
          opacity:0; scale:.6; transition:opacity .2s ease, scale .25s cubic-bezier(.2,.9,.3,1); }
  .pill.on { opacity:1; scale:1; }

  @media (max-width:700px) {
    .globe { width:84vw; }
    .corner.tl, .corner.tr { top:20px; }
    .corner.tl { left:16px; } .corner.tr { right:16px; }
    .corner.br { display:none; }
    .readout { left:16px; right:16px; bottom:22px; max-width:none; }
    .dial text { display:none; }
  }
  @media (prefers-reduced-motion:reduce) {
    .float, .shadow, .corner .dot { animation:none; }
    .tile { transition:box-shadow .2s ease, filter .2s ease; }
  }
</style>
</head>
<body>

<div class="grain" id="grain" aria-hidden="true"></div>

<main class="stage">
  <div class="corner tl"><span class="dot"></span>Akshat Kumar</div>
  <div class="corner tr">Work Index · <span id="count">12</span></div>

  <div class="globe" id="globe">
    <svg class="dial" viewBox="-112 -112 224 224" aria-hidden="true">
      <circle class="ring" r="96"/>
      <g id="ticks"></g>
      <g id="needle"><path d="M0 -96.5 L-2.4 -101.5 L2.4 -101.5Z"/></g>
    </svg>
    <div class="shadow"></div>
    <div class="float">
      <canvas id="wire" aria-hidden="true"></canvas>
      <div class="sphere" id="sphere"></div>
    </div>
  </div>

  <section class="readout" id="readout">
    <div class="ro-idx" id="roIdx"></div>
    <h1 class="ro-title" id="roTitle"></h1>
    <p class="ro-meta" id="roMeta"></p>
  </section>

  <div class="corner br" id="coords"></div>
</main>

<div class="pill" id="pill" aria-hidden="true">Open ↗</div>

<script>
/* Each entry is one project. The globe repeats the list to fill every
   card, so each project shows up several times around the sphere.
   Add `img:'path/to/shot.jpg'` to replace the generated poster.       */
const WORK = [
  { title:'Project 01', tag:'Web App',     year:'2026', url:'#' },
  { title:'Project 02', tag:'Branding',    year:'2026', url:'#' },
  { title:'Project 03', tag:'AI Tool',     year:'2025', url:'#' },
  { title:'Project 04', tag:'Mobile',      year:'2025', url:'#' },
  { title:'Project 05', tag:'Data Viz',    year:'2025', url:'#' },
  { title:'Project 06', tag:'Open Source', year:'2025', url:'#' },
  { title:'Project 07', tag:'Web App',     year:'2024', url:'#' },
  { title:'Project 08', tag:'Motion',      year:'2024', url:'#' },
  { title:'Project 09', tag:'Backend',     year:'2024', url:'#' },
  { title:'Project 10', tag:'Game',        year:'2024', url:'#' },
  { title:'Project 11', tag:'UI Kit',      year:'2023', url:'#' },
  { title:'Project 12', tag:'Research',    year:'2023', url:'#' }
];

const GLOBE = {
  count:   68,     // cards on the sphere
  size:    0.118,  // card width as a fraction of globe width
  jitter:  0.34,   // how much card sizes vary
  tiltMax: 11,     // per-card rotation, degrees
  minFade: 0.08,   // opacity of cards at the very back
  speed:   0.06,   // idle drift, degrees per frame
  wire:    true    // faint latitude/longitude lines inside the globe
};

(function () {
  const $ = id => document.getElementById(id);
  const globe = $('globe'), sphere = $('sphere'), wire = $('wire'), needle = $('needle'),
        readout = $('readout'), roIdx = $('roIdx'), roTitle = $('roTitle'), roMeta = $('roMeta'),
        coords = $('coords'), pill = $('pill');
  if (!globe || !sphere || !WORK.length) return;

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fine    = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const TAU = Math.PI * 2, DEG = 180 / Math.PI, PERSP = 1500;
  const n = WORK.length;
  const pad = v => String(v).padStart(2, '0');
  const clampTilt = v => Math.max(-72, Math.min(72, v));
  $('count').textContent = pad(n);

  function rng(seed) {
    let a = 2166136261;
    for (let i = 0; i < seed.length; i++) { a ^= seed.charCodeAt(i); a = Math.imul(a, 16777619); }
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }

  /* ---------- paper grain: one 160px noise tile ---------- */
  (function () {
    const el = $('grain'), S = 160, c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d'), d = g.createImageData(S, S);
    for (let i = 0; i < d.data.length; i += 4) {
      const v = 90 + Math.random() * 120 | 0;
      d.data[i] = v; d.data[i+1] = v * .94 | 0; d.data[i+2] = v * .86 | 0;
      d.data[i+3] = Math.random() * 38 | 0;
    }
    g.putImageData(d, 0, 0);
    el.style.backgroundImage = 'url(' + c.toDataURL() + ')';
  })();

  /* ---------- compass dial ---------- */
  (function () {
    let s = '';
    for (let d = 0; d < 360; d += 5) {
      const a = d / DEG, maj = d % 30 === 0, r1 = maj ? 103 : 99.5;
      const sx = Math.sin(a), cy = -Math.cos(a);
      s += '<line' + (maj ? ' class="maj"' : '') +
           ' x1="' + (sx * 96).toFixed(2) + '" y1="' + (cy * 96).toFixed(2) +
           '" x2="' + (sx * r1).toFixed(2) + '" y2="' + (cy * r1).toFixed(2) + '"/>';
    }
    for (const d of [0, 90, 180, 270]) {
      const a = d / DEG;
      s += '<text x="' + (Math.sin(a) * 108).toFixed(2) + '" y="' + (-Math.cos(a) * 108).toFixed(2) +
           '" text-anchor="middle" dominant-baseline="central">' + String(d).padStart(3, '0') + '</text>';
    }
    $('ticks').innerHTML = s;
  })();

  /* ---------- placeholder posters, one design per project ---------- */
  const COL = { ink:'#1f1d1a', clay:'#c65a3a', gold:'#e2a93b', sage:'#9aa57f', sea:'#3f5f7f',
                blush:'#eab9a3', paper:'#f4ecdd', moss:'#2f4a3a' };
  const DARK = { ink:1, clay:1, sea:1, moss:1 };
  const COMBOS = [
    ['paper','clay','ink'], ['ink','gold','paper'], ['sea','blush','paper'], ['clay','paper','ink'],
    ['sage','paper','moss'], ['gold','ink','clay'], ['moss','gold','paper'], ['blush','sea','ink'],
    ['paper','sea','gold'], ['ink','clay','blush'], ['paper','moss','clay'], ['sea','gold','paper']
  ];
  const MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';

  function poster(item, num) {
    const rr = rng(item.title);
    const [bgK, aK, bK] = COMBOS[(num - 1) % COMBOS.length];
    const A = COL[aK], B = COL[bK], text = DARK[bgK] ? COL.paper : COL.ink;
    const W = 240, H = 312, c = document.createElement('canvas');
    c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = COL[bgK]; x.fillRect(0, 0, W, H);
    const circle = (cx, cy, r) => { x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill(); };

    switch ((num - 1) % 7) {
      case 0:                                   // arch
        x.fillStyle = A; x.beginPath(); x.moveTo(56, 252); x.lineTo(56, 150);
        x.arc(120, 150, 64, Math.PI, 0); x.lineTo(184, 252); x.closePath(); x.fill();
        x.fillStyle = B; circle(120, 150, 24);
        break;
      case 1:                                   // sun over stripes
        x.fillStyle = A; circle(120, 142, 62);
        x.fillStyle = B; for (let y = 160; y <= 244; y += 14) x.fillRect(40, y, 160, 6);
        break;
      case 2:                                   // dot grid
        for (let m = 0; m < 4; m++) for (let k = 0; k < 4; k++) {
          const u = rr(), cx = 54 + k * 44, cy = 86 + m * 44;
          if (u < .5) { x.fillStyle = u < .25 ? A : B; circle(cx, cy, 14); }
          else { x.strokeStyle = A; x.lineWidth = 2; x.beginPath(); x.arc(cx, cy, 13, 0, TAU); x.stroke(); }
        }
        break;
      case 3:                                   // diagonal
        x.fillStyle = A; x.beginPath(); x.moveTo(20, 252); x.lineTo(220, 252); x.lineTo(220, 64);
        x.closePath(); x.fill();
        x.fillStyle = B; circle(78, 112, 30);
        break;
      case 4:                                   // bars
        for (let m = 0; m < 6; m++) { x.fillStyle = m % 2 ? B : A; x.fillRect(20, 72 + m * 30, 50 + rr() * 150, 18); }
        break;
      case 5: {                                 // quarter circles
        const S = 90;
        for (let r = 0; r < 2; r++) for (let q = 0; q < 2; q++) {
          const x0 = 30 + q * S, y0 = 72 + r * S, o = rr() * 4 | 0;
          const cx = x0 + (o === 1 || o === 2 ? S : 0), cy = y0 + (o >= 2 ? S : 0);
          const st = [0, .5, 1, 1.5][o] * Math.PI;
          x.fillStyle = rr() < .5 ? A : B;
          x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, S, st, st + Math.PI / 2); x.closePath(); x.fill();
        }
        break;
      }
      default:                                  // rings
        x.strokeStyle = A; x.lineWidth = 8;
        for (const r of [84, 64, 44, 24]) { x.beginPath(); x.arc(120, 160, r, 0, TAU); x.stroke(); }
        x.fillStyle = B; circle(120, 160, 10);
    }

    x.fillStyle = text;
    if ('letterSpacing' in x) x.letterSpacing = '1px';
    x.font = '600 18px ' + MONO; x.fillText(pad(num), 20, 36);
    x.font = '500 11px ' + MONO; x.textAlign = 'right'; x.fillText(item.year || '', W - 20, 34);
    x.fillText('↗', W - 20, H - 22);
    x.textAlign = 'left'; x.font = '500 12px ' + MONO;
    x.fillText(item.title.toUpperCase(), 20, H - 22);
    x.globalAlpha = .3; x.fillRect(20, 50, W - 40, 1); x.globalAlpha = 1;
    return c.toDataURL('image/jpeg', 0.86);
  }

  /* ---------- lay the cards out on a Fibonacci sphere ---------- */
  const N = Math.max(n, GLOBE.count);
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  const tiles = [];

  function vary(i, salt) {                    // stable per-card randomness
    let a = 2166136261;
    const k = 't' + i + salt;
    for (let q = 0; q < k.length; q++) { a ^= k.charCodeAt(q); a = Math.imul(a, 16777619); }
    return (a >>> 0) / 4294967296;
  }

  for (let i = 0; i < N; i++) {
    const k = i % n, item = WORK[k];
    const lat = Math.asin(1 - (i + 0.5) / N * 2), lon = GOLDEN * i;

    const a = document.createElement('a');
    a.className = 'tile';
    a.href = item.url || '#';
    a.draggable = false;
    a.dataset.k = k;
    a.setAttribute('aria-label', item.title + (item.tag ? ' — ' + item.tag : ''));
    if (i >= n) { a.tabIndex = -1; a.setAttribute('aria-hidden', 'true'); }   // repeats: one tab stop per project
    if (/^https?:/.test(item.url || '')) { a.target = '_blank'; a.rel = 'noopener'; }
    const img = document.createElement('img');
    img.alt = ''; img.decoding = 'async'; img.draggable = false;
    a.appendChild(img);

    a.style.setProperty('--lon', (lon * DEG).toFixed(3) + 'deg');
    a.style.setProperty('--lat', (-lat * DEG).toFixed(3) + 'deg');
    a.style.setProperty('--tz', ((vary(i, 'r') * 2 - 1) * GLOBE.tiltMax).toFixed(2) + 'deg');
    a.style.setProperty('--d0', Math.round(i / N * 560) + 'ms');         // intro sweeps pole to pole
    sphere.appendChild(a);

    tiles.push({ el: a, img, k, lat, lon,
                 sinLat: Math.sin(lat), cosLat: Math.cos(lat),
                 sinLon: Math.sin(lon), cosLon: Math.cos(lon), op: -1,
                 scale: 1 - GLOBE.jitter / 2 + vary(i, 's') * GLOBE.jitter });
  }

  let gw = 0, wsize = 0, dpr = 1, lastS = NaN, lastT = NaN;
  const wx = GLOBE.wire && wire ? wire.getContext('2d') : null;
  if (!wx && wire) wire.remove();

  function place() {
    gw = globe.clientWidth;
    sphere.style.setProperty('--R', (gw * 0.42).toFixed(1) + 'px');
    for (const t of tiles) {
      const w = Math.round(gw * GLOBE.size * t.scale), h = Math.round(w * 1.3);
      t.el.style.width = w + 'px'; t.el.style.height = h + 'px';
      t.el.style.marginLeft = (-w / 2) + 'px'; t.el.style.marginTop = (-h / 2) + 'px';
    }
    if (wx) {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      wsize = gw * 1.2;
      wire.width = wire.height = Math.round(wsize * dpr);
    }
    lastS = NaN;                              // force a redraw
  }

  /* ---------- wireframe: same rotation + perspective as the CSS ---------- */
  function drawWire() {
    const c = wsize / 2, R = gw * 0.42 * 0.965;
    const s = spin / DEG, t = tilt / DEG;
    const cs = Math.cos(s), ss = Math.sin(s), ct = Math.cos(t), st = Math.sin(t);
    const paths = [new Path2D(), new Path2D(), new Path2D(), new Path2D()];
    let px = 0, py = 0, pz = 0;
    function to(x0, y0, z0, first) {
      const x1 = x0 * cs + z0 * ss, z1 = -x0 * ss + z0 * cs;
      const y2 = y0 * ct - z1 * st, z2 = y0 * st + z1 * ct;
      const f = PERSP / (PERSP - z2 * R);
      const X = c + x1 * R * f, Y = c + y2 * R * f;
      if (!first) {                           // bucket by depth: back lines fainter
        const b = Math.min(3, (pz + z2 + 2) | 0);
        paths[b].moveTo(px, py); paths[b].lineTo(X, Y);
      }
      px = X; py = Y; pz = z2;
    }
    for (let m = 0; m < 12; m++) {
      const lo = m * Math.PI / 6, sl = Math.sin(lo), cl = Math.cos(lo);
      for (let k = 0; k <= 36; k++) {
        const la = -Math.PI / 2 + k * Math.PI / 36, cla = Math.cos(la);
        to(cla * sl, Math.sin(la), cla * cl, k === 0);
      }
    }
    for (let p = -2; p <= 2; p++) {
      const la = p * Math.PI / 6, y = Math.sin(la), r = Math.cos(la);
      for (let k = 0; k <= 60; k++) { const lo = k * TAU / 60; to(r * Math.sin(lo), y, r * Math.cos(lo), k === 0); }
    }
    wx.setTransform(dpr, 0, 0, dpr, 0, 0);
    wx.clearRect(0, 0, wsize, wsize);
    wx.lineWidth = 1;
    const alpha = [.045, .07, .11, .16];
    for (let b = 0; b < 4; b++) { wx.strokeStyle = 'rgba(29,27,23,' + alpha[b] + ')'; wx.stroke(paths[b]); }
  }

  /* ---------- depth shading ---------- */
  function shade() {
    const s = spin / DEG, t = tilt / DEG;
    const cs = Math.cos(s), ss = Math.sin(s), ct = Math.cos(t), st = Math.sin(t);
    for (const p of tiles) {
      const x0 = p.cosLat * p.sinLon, y0 = p.sinLat, z0 = p.cosLat * p.cosLon;
      const z1 = -x0 * ss + z0 * cs;          // rotateY
      const z2 =  y0 * st + z1 * ct;          // rotateX
      let o = GLOBE.minFade + (1 - GLOBE.minFade) * Math.pow((z2 + 1) / 2, 1.7);
      o = Math.round(o * 20) / 20;            // quantise to cut style churn
      if (o !== p.op) { p.el.style.opacity = o; p.op = o; }
    }
  }

  /* ---------- readout ---------- */
  const HINT = fine ? 'Drag to rotate · Hover to preview' : 'Drag to rotate · Tap to open';
  function swap() { readout.classList.remove('swap'); void readout.offsetWidth; readout.classList.add('swap'); }
  function idx(v) { return '<b>' + v + '</b><span>/</span><span>' + pad(n) + '</span>'; }
  function showDefault() {
    roIdx.innerHTML = idx('—');
    roTitle.innerHTML = 'Selected <em>Work</em>';
    roMeta.textContent = HINT;
    swap();
  }
  function show(k) {
    const w = WORK[k];
    roIdx.innerHTML = idx(pad(k + 1));
    roTitle.textContent = w.title;
    roMeta.textContent = [w.tag, w.year].filter(Boolean).join('  ·  ') || ' ';
    swap();
  }

  /* ---------- hover / focus ---------- */
  let hot = null, hotTimer = 0, aimAt = null;
  function setHot(el, byPointer) {
    clearTimeout(hotTimer);
    if (el === hot) return;
    if (hot) hot.classList.remove('on');
    hot = el;
    globe.classList.toggle('hovering', !!el);
    pill.classList.toggle('on', !!el && !!byPointer);
    if (el) { el.classList.add('on'); show(+el.dataset.k); } else showDefault();
  }
  sphere.addEventListener('pointerover', e => {
    if (e.pointerType === 'touch' || globe.classList.contains('drag')) return;
    const t = e.target.closest('.tile');
    if (t) setHot(t, true);
  });
  sphere.addEventListener('pointerout', e => {
    if (e.pointerType === 'touch') return;
    const to = e.relatedTarget instanceof Element ? e.relatedTarget.closest('.tile') : null;
    if (!to) { clearTimeout(hotTimer); hotTimer = setTimeout(() => setHot(null), 90); }
  });
  addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') pill.style.translate = (e.clientX + 18) + 'px ' + (e.clientY + 18) + 'px';
  }, { passive: true });

  /* keyboard: tabbing to a card turns the globe to face it */
  sphere.addEventListener('focusin', e => {
    const t = e.target.closest('.tile');
    if (!t || !t.matches(':focus-visible')) return;
    const p = tiles.find(q => q.el === t);
    aimAt = { spin: -p.lon * DEG, tilt: clampTilt(p.lat * DEG) };
    setHot(t, false);
  });
  sphere.addEventListener('focusout', () => { aimAt = null; setHot(null); });

  /* ---------- spin, drag, inertia ---------- */
  let spin = 0, tilt = -14, vSpin = 0, vTilt = 0;
  let dragging = false, moved = 0, lastX = 0, lastY = 0;

  globe.addEventListener('dragstart', e => e.preventDefault());
  globe.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    dragging = true; moved = 0; aimAt = null;
    lastX = e.clientX; lastY = e.clientY;
  });
  globe.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved <= 6) return;
    // capture only once it's really a drag, so a plain click still reaches the link
    if (!globe.hasPointerCapture(e.pointerId)) {
      globe.setPointerCapture(e.pointerId);
      globe.classList.add('drag');
      setHot(null);
    }
    vSpin = dx * 0.28; vTilt = -dy * 0.18;
    spin += vSpin; tilt = clampTilt(tilt + vTilt);
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    globe.classList.remove('drag');
  }
  addEventListener('pointerup', endDrag);
  addEventListener('pointercancel', endDrag);

  /* a drag that ends over a card must not count as a click */
  globe.addEventListener('click', e => {
    if (moved > 6) { e.preventDefault(); e.stopPropagation(); moved = 0; }
  }, true);

  /* ---------- render loop ---------- */
  let visible = true, tick = 0;
  if ('IntersectionObserver' in window)
    new IntersectionObserver(en => { visible = en[0].isIntersecting; }, { threshold: 0.02 }).observe(globe);

  function render() {
    if (spin === lastS && tilt === lastT) return;
    lastS = spin; lastT = tilt;
    sphere.style.transform = 'rotateX(' + tilt.toFixed(3) + 'deg) rotateY(' + spin.toFixed(3) + 'deg)';
    needle.setAttribute('transform', 'rotate(' + (spin % 360).toFixed(2) + ')');
    if (wx) drawWire();
    if ((tick++ & 1) === 0) shade();
    const lon = ((-spin % 360) + 360) % 360;
    const txt = 'LON ' + lon.toFixed(1).padStart(5, '0') + '°  ·  LAT ' +
                (tilt < 0 ? '−' : '+') + Math.abs(tilt).toFixed(1).padStart(4, '0') + '°';
    if (coords.textContent !== txt) coords.textContent = txt;
  }

  function loop() {
    requestAnimationFrame(loop);
    if (!visible || document.hidden) return;
    if (aimAt && !dragging) {
      const ds = ((aimAt.spin - spin) % 360 + 540) % 360 - 180;
      spin += ds * 0.1; tilt += (aimAt.tilt - tilt) * 0.1; vSpin = vTilt = 0;
    } else if (!dragging) {
      const idle = hot || reduced ? 0 : GLOBE.speed;
      vSpin += (idle - vSpin) * (hot ? 0.14 : 0.03);   // ease back to idle drift, or stop under the cursor
      if (!idle && Math.abs(vSpin) < 1e-4) vSpin = 0;
      vTilt *= 0.92;
      if (Math.abs(vTilt) < 1e-4) vTilt = 0;
      spin += vSpin;
      tilt  = clampTilt(tilt + vTilt);
    }
    render();
  }

  place();
  showDefault();
  render();
  shade();
  let placeTimer = null;
  addEventListener('resize', () => { clearTimeout(placeTimer); placeTimer = setTimeout(place, 200); });

  /* ---------- intro: wait briefly for the poster font, then burst out ---------- */
  const fontsReady = document.fonts && document.fonts.load
    ? Promise.race([
        Promise.all([document.fonts.load('600 18px "JetBrains Mono"'),
                     document.fonts.load('500 12px "JetBrains Mono"')]).catch(() => {}),
        new Promise(r => setTimeout(r, 1500))])
    : Promise.resolve();

  fontsReady.then(() => {
    const cache = [];
    for (const t of tiles) {
      const item = WORK[t.k];
      t.img.src = item.img || cache[t.k] || (cache[t.k] = poster(item, t.k + 1));
    }
    if (reduced) { globe.classList.add('ready', 'settled'); return; }
    void globe.offsetWidth;
    requestAnimationFrame(() => {
      globe.classList.add('ready');
      vSpin = 2.2;                              // whoosh in, then ease to idle
      setTimeout(() => globe.classList.add('settled'), 2600);
    });
  });

  loop();
})();
</script>
</body>
</html>
