<style>

         align-items:center; padding:28px 40px; }

  .mark { width:34px; height:34px; border:1px solid rgba(255,255,255,.2); border-radius:50%;

  nav a { color:var(--muted); text-decoration:none; transition:color .25s; display:flex; align-items:center; gap:8px; }
  nav a:hover, nav a.cur { color:var(--ink); }

  .status i { width:6px; height:6px; border-radius:50%; background:#3ddc84; box-shadow:0 0 10px #3ddc84; }

  .info dt { color:var(--dim); } .info dd { color:#cfcfd6; }
  .cta { display:inline-flex; gap:12px; align-items:center; margin-top:32px; padding:13px 20px;
         border:1px solid rgba(255,255,255,.16); border-radius:999px; color:var(--ink); text-decoration:none;
         font:500 11px var(--mono); letter-spacing:.12em; text-transform:uppercase;
         transition:background .3s, color .3s, border-color .3s; }

  .info.swap .desc { animation-delay:.12s } .info.swap dl { animation-delay:.16s }
  @keyframes swapIn { from { opacity:0; transform:translateY(12px); filter:blur(4px); } }

  /* project index */
  .index { position:absolute; right:40px; top:50%; transform:translateY(-50%); list-style:none;

  .ctrl button:hover { border-color:rgba(255,255,255,.4); color:var(--ink); }

  .tip { position:fixed; left:0; top:0; pointer-events:none; display:flex; gap:10px; align-items:center;
         font:500 10px var(--mono); letter-spacing:.14em; text-transform:uppercase; white-space:nowrap;

         opacity:0; scale:.85; transition:opacity .15s, scale .2s; }
  .tip.on { opacity:1; scale:1; }

  .loader { position:fixed; left:50%; top:50%; translate:-50% -50%; font:400 10.5px var(--mono);

  .loader.gone { opacity:0; }
  .loader::before { content:''; display:inline-block; width:6px; height:6px; border-radius:50%;
                    background:var(--ink); margin-right:12px; vertical-align:middle; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.2 } }

  @media (max-width:760px) {
    .top { grid-template-columns:1fr auto; padding:20px; }
    nav { display:none; }
    .info { left:20px; right:20px; top:auto; bottom:84px; width:auto; transform:none; }
    .info h2 { font-size:38px; margin-top:12px; }
    .desc, .info dl, .cta { display:none; }
    .index { display:none; }
    .bottom { left:20px; right:20px; bottom:20px; }
    .hint { display:none; }
  }
  @media (max-height:620px) and (min-width:761px) {
    .desc, .info dl { display:none; }
    .info h2 { margin-top:14px; }
    .cta { margin-top:20px; }
    .index li { padding:4px 0; }
  }
  @media (prefers-reduced-motion:reduce) {
    .fade, .info.swap * { transition:none !important; animation:none !important; }

const $ = id => document.getElementById(id);

const TAU = Math.PI * 2;
const SANS = '"Geist", "Inter", system-ui, sans-serif';
const MONO = '"Geist Mono", ui-monospace, Menlo, Consolas, monospace';
const pad = n => String(n).padStart(2, '0');

const lerp = (a, b, t) => a + (b - a) * t;
const sm = (a, b, t) => { const x = clamp((t - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const eo = (a, b, t) => { const x = clamp((t - a) / (b - a), 0, 1); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function rng(seed) {
  let a = 2166136261;
  for (let i = 0; i < seed.length; i++) { a ^= seed.charCodeAt(i); a = Math.imul(a, 16777619); }
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function isDark(hex) { const n = parseInt(hex.slice(1), 16); return ((n >> 16 & 255) * 299 + (n >> 8 & 255) * 587 + (n & 255) * 114) / 1000 < 140; }
function mixHex(h1, h2, t) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const c = s => Math.round(lerp(a >> s & 255, b >> s & 255, t));

}

/* ============================================================

const TW = 512, TH = 640;
const rrect = (x, X, Y, W, H, r) => { x.beginPath(); x.roundRect(X, Y, W, H, r); };
const circ = (x, X, Y, r) => { x.beginPath(); x.arc(X, Y, r, 0, TAU); };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function chip(x, X, Y, text, P) {
  x.font = `500 12px ${MONO}`;
  const w = x.measureText(text).width + 20;
  x.fillStyle = hexA(P.ink, .09); rrect(x, X, Y, w, 24, 12); x.fill();
  x.fillStyle = hexA(P.ink, .8); x.fillText(text, X + 10, Y + 16.5);
}
function bubble(x, S, y, right, wf, lines, P, r, cite) {
  const w = S.w * wf, h = 24 + lines * 18 + (cite ? 30 : 0);
  const bx = right ? S.x + S.w - 18 - w : S.x + 18;
  x.fillStyle = right ? P.a : hexA(P.ink, .06); rrect(x, bx, y, w, h, 14); x.fill();
  x.fillStyle = right ? (P.bubbleInk || '#fff') : hexA(P.ink, .38);
  for (let i = 0; i < lines; i++) {
    const lw = (w - 34) * (i === lines - 1 ? .45 + r() * .4 : .88 + r() * .12);
    rrect(x, bx + 17, y + 17 + i * 18, lw, 8, 4); x.fill();
  }
  if (cite) for (let k = 0; k < 3; k++) {
    const cx = bx + 17 + k * 44;
    x.strokeStyle = P.a; x.lineWidth = 1.5; rrect(x, cx, y + h - 32, 36, 20, 10); x.stroke();
    x.fillStyle = P.a; x.font = `500 11px ${MONO}`; x.fillText('[' + (k + 1) + ']', cx + 8, y + h - 18);
  }
  return y + h + 12;
}

const GEN = {
  agents(x, S, P, r) {

    const cols = [P.a, P.b, P.c], nodes = [];
    for (let i = 0; i < 9; i++) nodes.push({ x: S.x + 50 + r() * (S.w - 110), y: S.y + 44 + r() * (S.h - 88), c: cols[i % 3], s: 5 + r() * 9 });

    x.font = `500 12px ${MONO}`; x.fillStyle = hexA(P.ink, .5); x.fillText('ask your notes', S.x + 80, S.y + 27);
    let y = S.y + 62;
    y = bubble(x, S, y, false, .66, 2, P, r);

function cardGeometry() {
  const g = new THREE.PlaneGeometry(CW, CH, 12, 14);
  const pos = g.attributes.position, flat = pos.array.slice();
  for (let i = 0; i < pos.count; i++) {                    // wrap the plane onto the sphere surface
    const lo = pos.getX(i) / R, la = pos.getY(i) / R;
    pos.setXYZ(i, R * Math.cos(la) * Math.sin(lo), R * Math.sin(la), R * Math.cos(la) * Math.cos(lo) - R);
  }
  g.computeVertexNormals();
  const n = new Float32Array(pos.count * 3); for (let i = 0; i < pos.count; i++) n[i * 3 + 2] = 1;
  g.morphAttributes.position = [new THREE.Float32BufferAttribute(flat, 3)];   // morph 0 = flat card
  g.morphAttributes.normal = [new THREE.Float32BufferAttribute(n, 3)];
  return g;
}
function cardMaterial(tex) {
  const m = new THREE.MeshPhysicalMaterial({
    map: tex, emissiveMap: tex, emissive: 0xffffff, emissiveIntensity: 0.26,
    roughness: 0.4, metalness: 0, clearcoat: 0.8, clearcoatRoughness: 0.2,

  };
  return m;
}

      _r.multiply(_t.setFromAxisAngle(j.ax, a[0] * FLEX));

  coreLight.intensity = 2.5 * ck;

    r.line.geometry.setDrawRange(0, Math.floor(257 * rk));
    r.line.rotation.y += r.spin * dt;
    for (const s of r.sats) {
      s.a += r.speed * dt;
      s.s.position.set(Math.cos(s.a) * r.r, 0, Math.sin(s.a) * r.r);
      s.s.material.opacity = rk;
    }
  }
  dust.material.opacity = 0.55 * sm(3.2, 5.8, T);
  dust.rotation.y -= dt * 0.012;

  /* sphere motion */
  const hoverSlow = hovered ? 0.25 : 1;
  const boost = T > 2.9 ? 2.6 * (1 - sm(2.9, 6.0, T)) : 0;
  if (!dragging) {
    vSpin *= Math.pow(0.05, dt);
    vTilt *= Math.pow(0.02, dt);
    spin += (0.11 * hoverSlow + boost) * dt + vSpin;
    tilt = clamp(tilt + vTilt, -0.45, 0.45) * Math.pow(0.35, dt);
  }
  sphere.rotation.set(tilt, spin, 0, 'XYZ');
  rig.position.y = SPH_Y + Math.sin(time * 0.8) * 0.03;
  rig.updateMatrixWorld();

  /* camera */
  camera.position.x += (camBase.x + par.x * 0.32 - camera.position.x) * (1 - Math.pow(0.02, dt));
  camera.position.y += (camBase.y + par.y * 0.18 - camera.position.y) * (1 - Math.pow(0.02, dt));
  camera.position.z = camBase.z;
  camera.lookAt(TARGET);
  camera.updateMatrixWorld();

  /* where the selected card sits: in front of the sphere, facing the camera */
  rig.localToWorld(_w.copy(FRONT)); _w.y += Math.sin(time * 1.1) * 0.02;
  _m.lookAt(camera.position, _w, UP); _fq.setFromRotationMatrix(_m);
  _iq.copy(sphere.quaternion).invert();
  const frontLocal = _fp.copy(FRONT); frontLocal.y += Math.sin(time * 1.1) * 0.02; frontLocal.applyQuaternion(_iq);
  const frontQ = _iq.clone().multiply(_fq);

  /* hover */
  if (!dragging && T > 5) {
    const h = pick();
    if (h !== hovered) {
      hovered = h;
      canvas.classList.toggle('point', !!h);
      tip.classList.toggle('on', !!h);
      if (h) {
        const p = PROJECTS[h.pi];
        tip.querySelector('span').textContent = pad(h.pi + 1) + ' — ' + p.title + (h === selected ? '  ·  Open ↗' : '');
        tip.style.setProperty('--tipc', p.acc);
      }
    }
  } else if (hovered && dragging) { hovered = null; tip.classList.remove('on'); canvas.classList.remove('point'); }

  /* cards */
  for (const c of cards) {
    c.appear = Number.isFinite(FREEZE) || reduced ? eo(c.delay, c.delay + 1.4, T) : Math.max(c.appear, eo(c.delay, c.delay + 1.4, T));
    c.hover += ((c === hovered ? 1 : 0) - c.hover) * (1 - Math.pow(0.001, dt));
    c.t = clamp(c.t + (c.target ? dt : -dt) / 1.25, 0, 1);
    const a = c.appear, e = eio(c.t);
    _p.copy(c.slotPos).multiplyScalar(lerp(0.02, 1, a) * (1 + c.hover * 0.07 * (1 - e)));
    _q.copy(c.slotQuat);
    let s = Math.max(0.001, a);
    if (e > 0) {
      _w.copy(_p).lerp(frontLocal, e);
      const bulge = Math.sin(Math.PI * e) * 0.6;
      _w.addScaledVector(_w.clone().normalize(), bulge);
      _p.copy(_w); _q.slerp(frontQ, e); s = lerp(s, SEL_SCALE, e);
    }
    c.mesh.morphTargetInfluences[0] = e;
    c.mesh.position.copy(_p); c.mesh.quaternion.copy(_q); c.mesh.scale.setScalar(s);
    c.mat.emissiveIntensity = 0.26 + c.hover * 0.3 + e * 0.32;
  }

  /* brackets + glow follow the selected card */
  if (selected) {
    const m = selected.mesh, e = eio(selected.t);
    selFrame.position.copy(m.position); selFrame.quaternion.copy(m.quaternion); selFrame.scale.copy(m.scale);
    selFrame.material.opacity = e * e;
    _v.set(0, 0, -0.08).applyQuaternion(m.quaternion);
    selGlow.position.copy(m.position).add(_v);
    selGlow.material.opacity = 0.3 * e;
  } else { selFrame.material.opacity = 0; selGlow.material.opacity = 0; }

  /* intro beats */
  if (T > 4.9 && !uiShown) { uiShown = true; ui.classList.add('on'); }
  if (T > 5.3 && !introSelected) { introSelected = true; selectProject(current < 0 ? 0 : current); }
  if (T > 8 && time - lastInteract > 9 && !hovered && !dragging) {
    autoTimer += dt;
    if (autoTimer > 6.5) { autoTimer = 0; selectProject((current + 1) % PROJECTS.length); }
  } else autoTimer = 0;

  /* label under the sphere */
  _w.set(0, rig.position.y, 0).project(camera);
  const cx = (_w.x * .5 + .5) * innerWidth, cy = (-_w.y * .5 + .5) * innerHeight;
  _w.set(0, rig.position.y - R, 0).project(camera);
  const by = (-_w.y * .5 + .5) * innerHeight;
  label.style.left = cx + 'px'; label.style.top = (by + 30) + 'px';
  void cy;

  perfT += dt; perfN++;
  if (perfT > 2.5) {
    if (perfN / perfT < 40 && quality < QUALITY.length - 1) { quality++; fit(); }
    perfT = 0; perfN = 0;
  }

  finish.uniforms.uTime.value = time;
  composer.render();
  requestAnimationFrame(frame);
}

/* ============================================================
   BOOT
   ============================================================ */
const fontsReady = document.fonts && document.fonts.load
  ? Promise.race([Promise.all([document.fonts.load(`600 58px "Geist"`), document.fonts.load(`500 16px "Geist Mono"`)]).catch(() => {}),
                  new Promise(r => setTimeout(r, 2000))])
  : Promise.resolve();

fit();
Promise.all([fontsReady, handPromise]).then(() => {
  buildCards();
  camera.position.copy(camBase);
  startIntro();
  frame();
});

window.__scene = { THREE, scene, camera, chains, POSE, poseHand, cards, handRoot, get handMesh() { return handMesh; }, orientHand };
</script>
</body>
