<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akshat Kumar — Software and AI, made by hand</title>
<meta name="description" content="Akshat Kumar — selected software and AI work.">
<meta name="author" content="Akshat Kumar">
<meta name="copyright" content="© 2026 Akshat Kumar. All rights reserved.">
<!-- Designed and built by Akshat Kumar. © 2026 Akshat Kumar — all rights reserved; see LICENSE. -->
<meta name="theme-color" content="#f3ede2">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "d3-force": "https://cdn.jsdelivr.net/npm/d3-force@3/+esm",
  "lenis": "https://cdn.jsdelivr.net/npm/lenis@1.3.17/dist/lenis.mjs"
} }
</script>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" crossorigin>
<script type="module" src="js/main.js"></script>
</head>
<body>

<div class="grain" id="grain" aria-hidden="true"></div>

<div class="track" id="track">
  <main class="stage" id="stage">
    <canvas id="scene" aria-label="A pair of hands opening to reveal a globe of project cards"></canvas>
    <canvas class="ink" id="ink" aria-hidden="true"></canvas>

    <header class="top">
      <nav class="nav" aria-label="Sections">
        <a href="#work" id="navWork">Work</a><a href="#desk">Behind the scenes</a><a href="#about">About</a><a href="#contact">Contact</a>
      </nav>
    </header>

    <!-- the landing: the name, a line, and beside it the notes every project grew out of -->
    <section class="hero" id="hero">
      <h1 id="headline"></h1>
      <p class="tagline" id="tagline"></p>
      <p class="hero-meta" id="heroMeta"></p>
    </section>

    <div class="notes" id="notes" role="img" aria-label="A graph of notes, in the style of Obsidian's graph view">
      <canvas id="graph"></canvas>
    </div>

    <div class="hint" id="hint">Scroll<i></i></div>
    <div class="guide" id="guide" aria-live="polite"></div>

    <section class="readout away" id="readout">
      <div class="ro-idx" id="roIdx"></div>
      <h2 class="ro-title" id="roTitle"></h2>
      <p class="ro-meta" id="roMeta"></p>
    </section>

    <nav class="sr-only" aria-label="Projects"><ul id="links"></ul></nav>
  </main>
</div>

<!-- the site's sections as a stack of folders (js/files.js): scroll through them to
     Behind the scenes, whose sheet is the page below, and it opens out into it -->
<section class="files" id="files" aria-label="Sections">
  <div class="files-stage" id="filesStage"></div>
</section>

<!-- behind the scenes: GitHub, the music on, typing speed, coding time, what's on now,
     the tools (js/desk.js) — on a desktop screen, all of it on one page. Its place in the
     page is the slot; until you've scrolled it open, it sits in its folder's sheet, above. -->
<div class="desk-slot" id="deskSlot">
<section class="desk" id="desk" aria-labelledby="deskTitle">
  <header class="desk-head">
    <h2 class="desk-title" id="deskTitle"></h2>
    <p class="desk-intro" id="deskIntro"></p>
  </header>
  <div class="desk-grid">
    <article class="panel p-github" id="github" aria-label="GitHub activity"></article>
    <article class="panel p-music" id="music" aria-label="Music player"></article>
    <article class="panel p-typing" id="typing" aria-label="Typing speed"></article>
    <article class="panel p-coding" id="coding" aria-label="Coding time"></article>
    <article class="panel p-now" id="now" aria-label="Right now"></article>
    <article class="panel p-tools" id="tools" aria-label="Tools"></article>
  </div>
  <canvas class="desk-ink" id="deskInk" aria-hidden="true"></canvas>
  <div class="tip" id="tip" aria-hidden="true"></div>
</section>
</div>

<section class="section" id="about">
  <div class="sec-label">(04) About</div>
  <p class="sec-lead" id="aboutText"></p>
</section>

<section class="section" id="contact">
  <div class="sec-label">(05) Contact</div>
  <div class="contact-body">
    <p class="sec-kicker">Have something in mind?</p>
    <a class="mail" id="mail" href="#"></a>
    <ul class="socials" id="socials"></ul>
  </div>
  <footer class="foot"><span id="footName"></span><span id="footYear"></span></footer>
</section>

<div class="pill" id="pill" aria-hidden="true">Open ↗</div>

</body>
</html>
